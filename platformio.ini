[platformio]
src_dir = HomeAutomation

; ── Board environments ──────────────────────────────────────────────────────

[env:nodemcu]
platform = espressif8266
board    = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library @ ^1.4.7
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    knolleary/PubSubClient @ ^2.8
    sui77/rc-switch @ ^2.6.4

[env:xiao_esp32s3]
platform = espressif32
board    = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    knolleary/PubSubClient @ ^2.8
    sui77/rc-switch @ ^2.6.4

; ── Native unit-test environment ─────────────────────────────────────────────
; Compiles only the sensor .cpp files (no .ino, no DHT, no RCSwitch).
; Mocks for Arduino core and PubSubClient live in test/mocks/.

[env:native]
platform = native
build_flags =
    -std=c++14
    -I test/mocks
; Include only the sensor classes under test; exclude the sketch and
; classes that depend on external libraries (DHT, RCSwitch) for now.
build_src_filter =
    -<*>
    +<SmokeSensor.cpp>
    +<MotionSensor.cpp>
    +<lightSensor.cpp>
